replicaCount: 1

image:
  repository: myuser/myapp
  tag: "1.1.0"
  pullPolicy: IfNotPresent

containerPort: 8090

vault:
  server: http://vault.vault.svc:8200
  kvMount: secret
  authMount: kubernetes
  role: myapp

externalSecret:
  vaultKey: myapp
  targetSecretName: myapp-secrets
  refreshInterval: 1m

service:
  type: ClusterIP
  port: 8090

ingress:
  enabled: false
  host: myapp.local

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
